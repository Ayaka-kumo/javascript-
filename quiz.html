<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>シンプルクイズ</title>
    <link rel="stylesheet" href="quiz.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>シンプルクイズ</h1>
        <div id="quiz-area">
          <p id="question">読み込み中...</p>
          <div id="choices" class="choices"></div>
          <div class="controls">
            <button id="next-btn" disabled>次へ</button>
            <button id="restart-btn" hidden>もう一度</button>
          </div>
          <p id="progress" class="progress"></p>
        </div>
        <div id="result" class="result" hidden></div>
      </section>
    </main>
    <script src="quiz.js"></script>
  </body>
</html>
