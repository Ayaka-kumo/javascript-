<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rock-paper-scissors.css" />
  </head>
  <body>
    <main class="app">
      <section class="game-card">
        <h1>じゃんけんゲーム</h1>
        <p class="subtitle">ボタンを押して勝敗を決めよう！</p>

        <div class="choices">
          <button class="choice-btn" data-choice="rock">✊</button>
          <button class="choice-btn" data-choice="paper">✋</button>
          <button class="choice-btn" data-choice="scissors">✌️</button>
        </div>

        <div class="result-area">
          <p>あなたの選択: <span id="player-choice">-</span></p>
          <p>コンピュータの選択: <span id="computer-choice">-</span></p>
          <p id="message">勝負しよう！</p>
        </div>
      </section>
    </main>

    <script src="rock-paper-scissors.js"></script>
  </body>
</html>
